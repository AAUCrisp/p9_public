# user http;
user bamse;
# worker_processes  auto;
worker_processes  4;
# worker_processes  1;

# load_module "/usr/lib/nginx/modules/ngx_rtmp_module.so";

events {
    worker_connections  512;
    # worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    types_hash_bucket_size 128;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # Create a logging format to use
    log_format cmcd '$remote_addr - [$time_local] "$request" '
                    'CMCD-Headers: $http_cmcd_object $http_cmcd_request $http_cmcd_session $http_cmcd_status';


    log_format dash '$remote_addr - [$time_local] - Inside Main Dash';
    log_format cmcd_test '$remote_addr - [$time_local]\n'
                        '       CMCD Headers are: $http_cmcd_data\n'
                        '       CMCD-Object: $http_cmcd_object\n'
                        '       CMCD-Request: $http_cmcd_request\n'
                        '       CMCD-Session: $http_cmcd_session\n'
                        '       CMCD-Status: $http_cmcd_status\n';
                        # '       CMCD-Status: $http_cmcd_status\n'
                        # '       X-CMCD Headers are: $http_x_cmcd_data\n'
                        # '       X-CMCD: $http_cmcd';


    #  --  Troubleshooting Logs  --
    log_format has_cmcd '$remote_addr - [$time_local] -     CMCD Headers Present';
    log_format no_cmcd '$remote_addr - [$time_local] -      CMCD Headers NOT Present';
    log_format forward '$remote_addr - [$time_local] - Inside Forwarder';






    log_format custom_log '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_user_agent" "$http_referer" '
                        'Headers: $http_cmcd_objective $http_cmcd_request $http_cmcd_session '
                        '$http_x_cmcd_data $http_cmcd_status $http_cmcd';

    access_log /home/bamse/dev/p9/logs/custom_log.log custom_log;
    # access_log /home/bamse/Desktop/p9/back/logs/custom_log.log custom_log;



    log_format dynamic_headers '\n\n"$request"\n$remote_addr - [$time_local] -'
                            '$status '
                            'Headers: $http_headers';

    map $http_ $http_headers {
        default "$remote_addr | $time_local | Session ID | $http_x-sid | $session_log_id | $http_host | $http_user_agent | $http_cookie | FIN";
    }

    access_log /home/bamse/dev/p9/logs/all_headers.log dynamic_headers;
    # access_log /home/bamse/Desktop/p9/back/logs/all_headers.log dynamic_headers;




    # access_log /home/bamse/dev/p9logs/cmcd_access.log cmcd;
    # access_log /home/bamse/Desktop/p9/back/logs/cmcd_access.log cmcd;



    server {

        # listen 127.0.0.1:8080;
        # listen 8080;
        listen 80;
        server_name  localhost;
        # server_name  localhost p9;

        # root   /usr/share/nginx/html;
        root   /home/bamse/dev/p9/nginx;
        # root   /home/bamse/Desktop/p9/back/nginx;
        #charset koi8-r;

        # # NOT Root Location
        # location / {        #  Are these used not as ROOT, but as EVERY ADDRESS with a /, what isn't anywhere else in here?
        #     root   /home/bamse/Desktop/p9/back/nginx;
        #     index  index.html;
        #     # index  index.html index.htm;

        # }

        # # Log CMCD headers 
        # access_log /home/bamse/Desktop/p9/back/logs/cmcd_access.log cmcd;

        # location /debug_headers {
        #     more_set_headers -s 200 "Request-Headers: $http_*";
        #     return 200 'Headers dumped!';
        # }




        # FastAPI backend for processing CMCD headers
        location /cmcd_handler {
            internal;
            # proxy_pass http://192.168.50.3:5000; # FastAPI app
            proxy_pass http://192.168.50.85:5000; # FastAPI app
            # proxy_pass http://127.0.0.1:5000; # FastAPI app
            proxy_method POST;  # Use POST for CMCD forwarding

            proxy_set_header Host $host;
            proxy_set_header Http_Headers $http_headers;
            proxy_set_header Request $request;
            proxy_set_header X-Real-IP $remote_addr;
            # proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    

        # Webplayer
        location /player {
            # root   /home/bamse/Desktop/p9/back/nginx;
            # root   /usr/share/nginx/html;
            # index  player.html player.htm;
            try_files /player.html =404;
        }




        ######################################
        ##  --  Newer Test Version  --
        #          Start



        # Root directory for serving content
        location /media/ {
            root /home/bamse/dev/p9;  # Directory where DASH content is stored
            # root /home/bamse/Desktop/p9/back/media;  # Directory where DASH content is stored

            autoindex on;
            autoindex_exact_size off;
            autoindex_format html;

            # Log CMCD headers
            access_log /home/bamse/dev/p9/logs/cmcd_access.log cmcd;
            # access_log /home/bamse/Desktop/p9/back/logs/cmcd_access.log cmcd;


            #  Headers
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';




            # Prevent MIME type errors by serving correct file extensions
            default_type application/octet-stream;



            # Forward CMCD headers to FastAPI
            proxy_set_header CMCD-Data $http_cmcd_data;
            proxy_set_header CMCD-Other $http_cmcd_other;
            # proxy_set_header Http_Headers $http_headers;
            proxy_set_header Host $host;

            # Mirror requests to FastAPI for CMCD processing
            mirror /cmcd_handler;
        }



        location ~ \.mpd$ {
            add_header Content-Type application/dash+xml;
            types {
                application/dash+xml mpd;
                video/mp4 mp4;
            }
        }

        # Root directory for serving DASH content
        location ~ \.m3u8$ {

            types {
                add_header Content-Type application/vnd.apple.mpegurl;
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

        }




        #           End
        ##  --  New Test Setup  --
