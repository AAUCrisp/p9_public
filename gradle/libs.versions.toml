###############################
##    VERSIONS AREA

[versions]

agp = "8.7.2"
converterGson = "VERSION"
daggerVersion = "2.51.1"
daggerCompiler = "2.51.1"
hiltCompiler = "1.2.0"
#kotlin = "1.9.0"
kotlin = "2.0.20"
kspVersion = "2.0.20-1.0.24"
coreKtx = "1.13.1"
firebase = "4.4.2"
firebase-bom = "33.5.1"
# Testing
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
# Sessions
lifecycleRuntimeKtx = "2.8.6"
lifecycleViewModel = "2.8.6"
# UI
activityCompose = "1.9.2"
composeBom = "2024.09.03"
extendedIcons = "1.7.3"
material = "1.1.1"
# Media3
media3Common = "1.4.1"
okhttp = "3.12.13"
retrofit = "2.9.0"




###############################
##    LIBRARIES AREA

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }

# Firebase Performance Monitoring
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref="firebase-bom"}
firebase-config = {group = "com.google.firebase", name = "firebase-config-ktx"}
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics"}
firebase-perf = { group = "com.google.firebase", name = "firebase-perf"}



# AndroidX Media3
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3Common" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3Common" }
androidx-media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3Common" }
androidx-media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3Common" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3Common" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3Common" }



# Dagger
dagger = { module = "com.google.dagger:dagger", version.ref = "daggerVersion" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "daggerVersion" }
dagger-hilt = { module = "com.google.dagger:hilt-android", version.ref = "daggerVersion" }
dagger-hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "daggerVersion" }


# Hilt
hilt-compiler = { module="androidx.hilt:hilt-compiler", version.ref = "hiltCompiler"}
hilt-navigation = { module="androidx.hilt:hilt-navigation-compose", version.ref = "hiltCompiler"}



# SEEMS TO BE FOR TEST BUILDS
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

# Runtime Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewModel" }



androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material = { group = "androidx.compose.material", name = "material", version.ref = "material" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "extendedIcons" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }
#retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "converterGson" }



###############################
##    PLUGINS AREA

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Firebase Performance Monitoring
firebase = { id = "com.google.gms.google-services", version.ref = "firebase"}


# KSP
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "kspVersion" }
dagger-hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "daggerVersion" }
